<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00C2FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
      <animate attributeName="x1" values="-300;1200" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1500" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="0" y="6.5" width="1200" height="1" fill="#00C2FF" fill-opacity=".18"/>
  <rect x="0" y="5.5" width="1200" height="3" rx="1.5" fill="url(#g)"/>
</svg>
